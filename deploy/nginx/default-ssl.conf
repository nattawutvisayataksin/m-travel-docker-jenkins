# nginx config สำหรับ deploy จริงบน Docker server (HTTPS)
# ไฟล์นี้จะถูก mount ทับ /etc/nginx/conf.d/default.conf โดย docker-compose.ssl.yml
# cert และ key ถูก mount จาก ${CERT_DIR} เข้า /etc/nginx/certs โดยรันผ่าน playbook ของ ansible

server {
    # HTTP → รีไดเรกต์ไป HTTPS ทันที
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/m-travel.crt;
    ssl_certificate_key /etc/nginx/certs/m-travel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ไฟล์ static ให้แคชได้
    location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

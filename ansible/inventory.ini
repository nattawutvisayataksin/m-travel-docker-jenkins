# Ansible inventory — สำหรับรันแบบ CLI (ใน AWX ให้สร้าง/ใช้ Inventory ที่หน้าเว็บแทน)
# playbook มี hosts: all จึงชื่อ host อะไรก็ได้ และจะรับเป็นทีละเครื่องหรือทั้งกลุ่มตามที่เลือก

[vault-deploy]
m-travel-205 ansible_host=10.119.16.205 ansible_user=root ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'


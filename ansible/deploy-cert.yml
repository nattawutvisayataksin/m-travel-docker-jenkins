---
# =====================================================================
# Deploy TLS certificate + nginx HTTPS จาก HashiCorp Vault (KV v2)
#   path ที่อ่าน: <vault_mount>/data/<vault_path>  → secret/data/certificates/bu.ac.th
#
# เดิมเขียนให้รันแบบ CLI ตอนนี้รันผ่าน AWX 24.6.1 ได้ด้วย:
#   - hosts: all        → ใส่ IP/ชื่อ host อะไรก็ได้ใน Inventory ที่เลือก (limit ได้ตามชื่อ)
#   - ตัวแปรทั้งหมด override ผ่าน host var / extra var ด้วยชื่อที่ต่อด้วย _ เช่น
#         _vault_version, _cert_dir, _repo_dir, _https_port
#   - เป้าหมายถ้ายังไม่มี curl/git/openssl/docker → playbook ติดตั้งให้เองอัตโนมัติ
#
# รันแบบ CLI:   ansible-playbook -i inventory.ini deploy-cert.yml [+ -e _vault_version=4]
# รันผ่าน AWX:  Job Template → Machine Credential + Custom Credential "Vault Token"
#
# กติกาความปลอดภัย: ทุก task ที่แตะค่าลับใช้ no_log และห้ามเขียนค่าลับลงไฟล์นี้เด็ดขาด
# =====================================================================

- name: Deploy TLS certificate for m-travel nginx from Vault
  hosts: all
  gather_facts: true

  vars:
    # ค่า default — เครื่อง .205 ใช้ชุดนี้ได้ทันที (แก้ที่ hostname var ได้เมื่อจำเป็น)
    vault_addr: "{{ _vault_addr | default('https://hashiva.bu.ac.th') }}"
    vault_mount: "{{ _vault_mount | default('secret') }}"
    vault_path: "{{ _vault_path | default('certificates/bu.ac.th') }}"
    vault_version: "{{ _vault_version | default('') }}"   # ว่าง = อ่านเวอร์ชันล่าสุด
    vault_token: "{{ vault_token_arg | default(lookup('env', 'VAULT_TOKEN'), true) }}"
    cert_dir: "{{ _cert_dir | default('/root/m-travel-cert') }}"
    repo_dir: "{{ _repo_dir | default('/opt/m-travel-docker-jenkins') }}"
    https_port: "{{ _https_port | default('443') }}"
    repo_url: "{{ _repo_url | default('https://github.com/nattawutvisayataksin/m-travel-docker-jenkins.git') }}"

  pre_tasks:
    - name: ตรวจว่ามี Vault token ก่อนเริ่ม (ใส่ผ่าน env VAULT_TOKEN หรือ -e vault_token_arg=...)
      ansible.builtin.fail:
        msg: >-
          ยังไม่มี Vault token — ขั้นตอนแนะนำคือสร้าง Custom Credential Type
          "Vault Token" ใน AWX แล้ว attach เข้า Job Template
          (หรือรัน CLI ด้วย export VAULT_TOKEN=...)
      when: vault_token | length == 0
      no_log: true

    - name: ติดตั้ง curl / git / openssl บนเป้าหมาย (ถ้ายังไม่มี)
      ansible.builtin.package:
        name:
          - curl
          - git
          - openssl
        state: present

    - name: ติดตั้ง Docker รวม compose plugin ถ้ายังไม่มี (ระบบ Ubuntu/Debian มาตรฐาน)
      ansible.builtin.shell: "curl -fsSL https://get.docker.com | sh"
      args:
        creates: /usr/bin/docker

  tasks:
    # ---------- 1) อ่านความลับจาก Vault (รันที่ controller หรือ execution environment) ----------
    - name: อ่าน secret จาก Vault KV v2
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_mount }}/data/{{ vault_path }}{{ '?version=' ~ vault_version if vault_version else '' }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
        return_content: true
      delegate_to: localhost
      become: false
      register: vault_resp
      no_log: true
      changed_when: false

    - name: ดึงเฉพาะฟิลด์ certificate และ private_key
      ansible.builtin.set_fact:
        tls_certificate: "{{ vault_resp.json.data.data.certificate | trim }}"
        tls_private_key: "{{ vault_resp.json.data.data.private_key | trim }}"
      delegate_to: localhost
      become: false
      no_log: true

    # ---------- 2) เขียนไฟล์ cert/key ลงเป้าหมาย ----------
    - name: สร้างโฟลเดอร์เก็บ cert
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: เขียนไฟล์ certificate (fullchain — ใน BU.crt มีครบ 3 ใบ)
      ansible.builtin.copy:
        content: "{{ tls_certificate }}\n"
        dest: "{{ cert_dir }}/m-travel.crt"
        owner: root
        group: root
        mode: "0644"
      no_log: true
      notify: restart web container

    - name: เขียนไฟล์ private key
      ansible.builtin.copy:
        content: "{{ tls_private_key }}\n"
        dest: "{{ cert_dir }}/m-travel.key"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: restart web container

    # ---------- 3) sanity check ว่า cert กับ key เป็นคู่เดียวกัน ----------
    - name: ตรวจคู่ cert/key ด้วย openssl (public key ต้องตรงกัน)
      ansible.builtin.shell: |
        set -o pipefail
        [ "$(openssl x509 -in {{ cert_dir }}/m-travel.crt -noout -pubkey | openssl sha256)" = \
          "$(openssl pkey -in {{ cert_dir }}/m-travel.key -pubout | openssl sha256)" ]
      args:
        executable: /bin/bash
      changed_when: false

    - name: แสดงวันหมดอายุจริงของ cert (อ่านจากใบ cert ไม่ใช้ฟิลด์ expires_at ใน Vault)
      ansible.builtin.command: "openssl x509 -in {{ cert_dir }}/m-travel.crt -noout -enddate -subject"
      changed_when: false

    # ---------- 4) อัปเดต repo (มี docker-compose.ssl.yml + default-ssl.conf พร้อมใช้) ----------
    - name: git clone / update m-travel repo ลงเป้าหมาย
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: main
        update: true

    # ---------- 5) deploy nginx HTTPS ----------
    - name: docker compose up ด้วยโปรไฟล์ SSL (เอา CERT_DIR เสียบให้ compose ผูกถูกโฟลเดอร์)
      ansible.builtin.command: >-
        docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d --build
      args:
        chdir: "{{ repo_dir }}"
      environment:
        CERT_DIR: "{{ cert_dir }}"
        HTTPS_PORT: "{{ https_port }}"

    # ---------- 6) smoke test (รันบนเป้าหมาย ไม่ validate cert เพราะเรียกด้วย localhost) ----------
    - name: ตรวจว่า nginx HTTPS ตอบ 200
      ansible.builtin.uri:
        url: "https://localhost:{{ https_port }}/"
        validate_certs: false
      register: smoke
      failed_when: smoke.status != 200

  handlers:
    - name: restart web container
      ansible.builtin.command: >-
        docker compose -f docker-compose.yml -f docker-compose.ssl.yml restart web
      args:
        chdir: "{{ repo_dir }}"
      environment:
        CERT_DIR: "{{ cert_dir }}"
        HTTPS_PORT: "{{ https_port }}"
